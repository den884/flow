<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLOW CRM - PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #050505; --surface: rgba(22, 22, 22, 0.75);
            --border: rgba(255, 255, 255, 0.08); --accent: #ffffff;
            --text-main: #f2f2f2; --text-muted: #808080;
        }
        body {
            background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
            padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin: 0 0 20px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.3); color: var(--text-main);
            border: 1px solid var(--border); border-radius: 10px; font-size: 15px; box-sizing: border-box; outline: none; appearance: none;
        }
        .flex-row { display: flex; gap: 12px; }
        .toggle-group { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-top: 1px solid var(--border); }
        .toggle-group div { display: flex; flex-direction: column; }
        .toggle-group label { margin: 0; font-size: 14px; font-weight: 500; color: var(--text-main); text-transform: none; }
        .toggle-group span { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; border-radius: 30px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 2px; bottom: 2px; background-color: #fff; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); background-color: #000; }
        button {
            width: 100%; padding: 16px; margin-top: 24px; background: var(--accent); color: #000;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Поисковые векторы</h2>
    <div class="input-group">
        <input type="text" id="query" placeholder="бизнес подкасты, арбитраж..." value="бизнес подкасты">
    </div>

    <div class="flex-row">
        <div class="input-group" style="flex: 1;">
            <label>Лимит лидов</label>
            <input type="number" id="limit" value="250">
        </div>
        <div class="input-group" style="flex: 1.5;">
            <label>Формат</label>
            <select id="content_format">
                <option value="all">Любой формат</option>
                <option value="long">Длинные видео</option>
                <option value="shorts">Shorts</option>
            </select>
        </div>
    </div>

    <div class="input-group">
        <label>Сабы (Мин - Макс)</label>
        <div class="flex-row">
            <input type="number" id="subs_min" value="5000">
            <input type="number" id="subs_max" value="500000">
        </div>
    </div>

    <div class="input-group">
        <label>Просмотры (Мин - Макс)</label>
        <div class="flex-row">
            <input type="number" id="views_min" placeholder="0">
            <input type="number" id="views_max" placeholder="0">
        </div>
    </div>

    <div class="input-group">
        <label>Период публикации</label>
        <select id="time_period">
            <option value="all_time" selected>За всё время</option>
            <option value="1_month">За месяц</option>
        </select>
    </div>

    <div class="toggle-group">
        <div><label>Режим Deep Scan</label><span>Внутренний поиск контактов</span></div>
        <label class="switch"><input type="checkbox" id="deep_scan"><span class="slider"></span></label>
    </div>

    <div class="toggle-group">
        <div><label>Только с контактами</label><span>Telegram / Email</span></div>
        <label class="switch"><input type="checkbox" id="require_contacts" checked><span class="slider"></span></label>
    </div>

    <button id="submitBtn" onclick="sendData()">ИНИЦИИРОВАТЬ СБОР</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function sendData() {
        let btn = document.getElementById("submitBtn");
        btn.innerText = "ЗАПУСКАЮ...";
        
        let vMin = document.getElementById("views_min").value;
        let vMax = document.getElementById("views_max").value;

        // Полная защита от отправки пустых значений
        let requestData = {
            user_id: tg.initDataUnsafe?.user?.id || 0,
            vector: document.getElementById("query").value || "бизнес подкасты",
            limit: parseInt(document.getElementById("limit").value) || 250,
            subs_min: parseInt(document.getElementById("subs_min").value) || 5000,
            subs_max: parseInt(document.getElementById("subs_max").value) || 500000,
            period: document.getElementById("time_period").value,
            views_min: vMin ? parseInt(vMin) : 0, 
            views_max: vMax ? parseInt(vMax) : 0,
            format_content: document.getElementById("content_format").value,
            deep_scan: document.getElementById("deep_scan").checked,
            only_with_contacts: document.getElementById("require_contacts").checked
        };

        // ТУТ ВСТАВЬ АКТУАЛЬНУЮ ССЫЛКУ ИЗ ТЕРМИНАЛА LOCALTUNNEL!
        const API_URL = "https://my-flow-test.loca.lt/api/v1/parse";

        fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Bypass-Tunnel-Reminder": "true",
                "ngrok-skip-browser-warning": "true"
            },
            body: JSON.stringify(requestData)
        })
        .then(async response => {
            if(response.ok) {
                tg.HapticFeedback.notificationOccurred("success");
                tg.showAlert("Сбор запущен. Таблица придет в чат.");
                setTimeout(() => tg.close(), 1500);
            } else { 
                let errText = await response.text();
                throw new Error(`Ошибка сервера ${response.status}: ${errText}`); 
            }
        })
        .catch(error => {
            tg.HapticFeedback.notificationOccurred("error");
            tg.showAlert("Связь с сервером потеряна.\n\nПроверь:\n1. Работает ли python main.py?\n2. Совпадает ли ссылка localtunnel в коде Vercel?\n\nТехническая инфа: " + error.message);
            btn.innerText = "ИНИЦИИРОВАТЬ СБОР";
        });
    }
</script>
</body>
</html>
