<script>
    let tg = window.Telegram.WebApp;
    tg.expand(); // Открываем на весь экран

    function sendData() {
        // 1. Собираем данные и переименовываем ключи строго под твой models.py
        let requestData = {
            vector: document.getElementById("query").value,
            limit: parseInt(document.getElementById("limit").value) || 250,
            subs_min: parseInt(document.getElementById("subs_min").value) || 5000,
            subs_max: parseInt(document.getElementById("subs_max").value) || 500000,
            period: document.getElementById("time_period").value,
            // Если поля просмотров пустые, отправляем null, как и ждет Optional[int]
            views_min: document.getElementById("views_min").value ? parseInt(document.getElementById("views_min").value) : null,
            views_max: document.getElementById("views_max").value ? parseInt(document.getElementById("views_max").value) : null,
            format_content: document.getElementById("content_format").value,
            deep_scan: document.getElementById("deep_scan").checked,
            only_with_contacts: document.getElementById("require_contacts").checked
        };

        // 2. Делаем кнопку неактивной, чтобы не нажали 10 раз
        let btn = document.querySelector("button");
        let originalText = btn.innerText;
        btn.innerText = "ЗАПУСКАЮ СБОР...";
        btn.style.background = "#555";
        btn.style.color = "#fff";
        btn.disabled = true;

        // 3. Отправляем прямой POST-запрос в твой "Мозг" через туннель
        fetch("https://flow-core-pro.loca.lt/api/v1/parse", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                // Тот самый критически важный заголовок для обхода заглушки localtunnel
                "Bypass-Tunnel-Reminder": "true" 
            },
            body: JSON.stringify(requestData)
        })
        .then(response => {
            if(response.ok) {
                // Если FastAPI ответил статусом 200 (Всё ок)
                tg.showAlert("Сбор данных успешно инициализирован! Результат будет выгружен в БД.");
                tg.close(); // Автоматически закрываем Mini App
            } else {
                // Если ошибка сервера (например, 422 или 500)
                tg.showAlert("Ошибка при запуске. Проверь терминал сервера (main.py).");
                btn.innerText = originalText;
                btn.style.background = "#ffffff";
                btn.style.color = "#000000";
                btn.disabled = false;
            }
        })
        .catch(error => {
            // Если сервер вообще недоступен (упал localtunnel или выключен python)
            tg.showAlert("Сервер FLOW CORE недоступен! Проверь, запущен ли localtunnel и main.py.");
            btn.innerText = originalText;
            btn.style.background = "#ffffff";
            btn.style.color = "#000000";
            btn.disabled = false;
        });
    }
</script>
